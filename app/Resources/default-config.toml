# Nuimo mapping for NuimoBar. Changes take effect immediately, without a restart.
# If the file contains an error, the previous mapping stays active and the menu shows the error.
#
# Order: active mode → profile of the app in front → [default].
# The first profile that contains an event decides. "none" deliberately silences an event.
#
# Events:
#   press, long_press, double_press
#   hold                                            → press and release separately, turns off press,
#                                                     long_press and double_press
#   swipe_left, swipe_right, swipe_up, swipe_down
#   touch_left, touch_right, touch_top, touch_bottom
#   longtouch_left, longtouch_right, longtouch_top, longtouch_bottom
#   fly_left, fly_right
#   rotate, rotate_pressed                          → continuous: "volume", "scroll" or "midi:cc:…"
#   rotate_left, rotate_right,                      → in steps, e.g. with keyboard shortcuts
#   rotate_pressed_left, rotate_pressed_right
#
# Actions:
#   "keys:opt+return"        keyboard shortcut from cmd, shift, ctrl, opt and one key
#   "media:playpause"        media key: playpause, next, previous, mute
#   "volume"                 system volume, with a level on the matrix (rotate only)
#   "scroll"                 mouse wheel at the pointer (rotate only), also with keys, e.g. "scroll:ctrl+opt"
#   "shell:…"                shell command, e.g. "shell:shortcuts run 'Lights on'"
#   "midi:note:36"           note; with hold it is held while pressed
#   "midi:cc:20"             CC; absolute 0–127 with rotate, 127/0 with hold, otherwise a short 127
#   "midi:cc:21:relative"    relative CC (rotate only), encoded according to midi_relative
#   "midi:cc:22=64"          CC with a fixed value
#   "midi:pc:0"              Program Change
#   "mode:Resolume"          switch a mode on, also "mode:off" and "mode:toggle:Resolume"
#   "none"                   do nothing, not even what a following profile contains
#
# MIDI actions can get their own channel with @<channel>, e.g. "midi:note:36@10".
#
# Apps are recognized by their name (as in the Dock) or their bundle ID. Names with spaces go in
# quotes: [apps."Google Chrome"]. Letter keys follow the US keyboard position: on a German
# keyboard, y and z are swapped.

[settings]
scroll_speed = 0.5      # pixels per rotation unit; negative reverses the direction
rotate_step = 300       # rotation units per step for rotate_left/right (one full turn is about 2650)
midi_channel = 1        # MIDI channel 1–16 used when an action does not specify one
midi_cc_per_turn = 127  # change of a CC value per full turn
midi_relative = "twos"  # relative CCs: "twos" (1 = +1, 127 = −1) or "offset" (65 = +1, 63 = −1)

[default]
rotate = "volume"
press = "media:playpause"
double_press = "media:mute"
swipe_left = "media:previous"
swipe_right = "media:next"
# longtouch_top = "mode:toggle:Resolume"  # switch the Resolume mode with a gesture, see below

[apps.TradingView]
rotate = "scroll"
press = "keys:opt+return"      # maximize the active chart in the layout / back
swipe_right = "keys:tab"       # next chart
swipe_left = "keys:shift+tab"  # previous chart

# Example of a mode that applies regardless of the app. Remove the # signs to try it.
# Switch it on and off from the menu or, with the line in [default], with a long touch at the top.
#
# [modes.Resolume]
# rotate = "midi:cc:20"                  # e.g. layer opacity
# rotate_pressed = "midi:cc:21:relative" # e.g. effect amount, set to "Relative" in Resolume
# hold = "midi:note:40"                  # flash while held
# swipe_right = "midi:note:36"           # next clip
# swipe_left = "midi:note:37"            # previous clip
# longtouch_top = "mode:toggle:Resolume"
