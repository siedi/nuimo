# Nuimo mapping per app. Changes take effect immediately, without a restart.
#
# Events:
#   press, long_press, double_press
#   swipe_left, swipe_right, swipe_up, swipe_down
#   touch_left, touch_right, touch_top, touch_bottom
#   longtouch_left, longtouch_right, longtouch_top, longtouch_bottom
#   fly_left, fly_right
#   rotate, rotate_pressed                          → continuous: "volume" or "scroll"
#   rotate_left, rotate_right,                      → in steps, e.g. with keyboard shortcuts
#   rotate_pressed_left, rotate_pressed_right
#
# Actions:
#   "keys:opt+return"   keyboard shortcut from cmd, shift, ctrl, opt and one key
#   "media:playpause"   media key: playpause, next, previous, mute
#   "volume"            system volume, with a level on the matrix (rotate only)
#   "scroll"            mouse wheel at the pointer (rotate only), also with keys, e.g. "scroll:ctrl+opt"
#   "shell:…"           shell command, e.g. "shell:shortcuts run 'Lights on'"
#   "none"              do nothing, not even what the default profile contains
#
# Apps are recognized by their name (as in the Dock) or their bundle ID. Names with spaces go in
# quotes: [apps."Google Chrome"]. Anything an app profile does not map comes from [default].
# Letter keys follow the US keyboard position: on a German keyboard, y and z are swapped.

[settings]
scroll_speed = 0.5  # pixels per rotation unit; negative reverses the direction
rotate_step = 300   # rotation units per step for rotate_left/right (one full turn is about 2650)

[default]
rotate = "volume"
press = "media:playpause"
double_press = "media:mute"
swipe_left = "media:previous"
swipe_right = "media:next"

[apps.TradingView]
rotate = "scroll"
press = "keys:opt+return"      # maximize the active chart in the layout / back
swipe_right = "keys:tab"       # next chart
swipe_left = "keys:shift+tab"  # previous chart
